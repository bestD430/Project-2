<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>RTHK 電台直播</title>

<style>
body {
    margin: 0;
    padding: 20px;
    background: #f5f5f7;
    font-family: Arial, sans-serif;
}

h1 {
    text-align: center;
}

button {
    display: block;
    width: 100%;
    max-width: 500px;
    margin: 12px auto;
    padding: 18px;
    border: 0;
    border-radius: 10px;
    background: #0066cc;
    color: white;
    font-size: 18px;
}

button:active {
    background: #004c99;
}

#status {
    text-align: center;
    margin: 20px;
    color: #666;
}
</style>
</head>

<body>

<h1>RTHK 電台直播</h1>

<button onclick="openRadio(1)">
    香港電台第一台
</button>

<button onclick="openRadio(2)">
    香港電台第二台
</button>

<button onclick="openRadio(3)">
    香港電台第三台
</button>

<button onclick="openRadio(4)">
    香港電台第四台
</button>

<button onclick="openRadio(5)">
    香港電台第五台
</button>

<div id="status">
    請選擇電台
</div>

<script>

function openRadio(channel) {

    document.getElementById("status").innerText =
        "正在開啟 RTHK 官方直播...";

    /*
     * RTHK 官方直播播放器
     *
     * radio1 = 第一台
     * radio2 = 第二台
     * radio3 = 第三台
     * radio4 = 第四台
     * radio5 = 第五台
     */

    var url =
        "https://programme.rthk.hk/channel/radio/player_live_txt.php?lang=chi";

    /*
     * 舊版 Safari 不適合自行解析 HLS，
     * 直接交給 RTHK 官方播放器處理。
     */

    window.location.href = url;
}

</script>

</body>
</html>
