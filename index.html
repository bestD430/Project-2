<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="香港電台">
    
    <!-- Android -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#d32f2f">
    <meta name="application-name" content="香港電台">
    
    <title>香港電台 + 商業電台</title>

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23d32f2f'/%3E%3Ctext x='90' y='108' font-family='Arial,Helvetica,sans-serif' font-size='42' font-weight='bold' fill='white' text-anchor='middle'%3ERTHK%3C/text%3E%3C/svg%3E">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23d32f2f'/%3E%3Ctext x='90' y='108' font-family='Arial,Helvetica,sans-serif' font-size='42' font-weight='bold' fill='white' text-anchor='middle'%3ERTHK%3C/text%3E%3C/svg%3E">

    <script>
        const manifest = {
            name: "香港電台",
            short_name: "RTHK",
            description: "香港電台 + 商業電台簡易播放器",
            start_url: "./",
            display: "standalone",
            background_color: "#f4f6f8",
            theme_color: "#d32f2f",
            icons: [{
                src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23d32f2f'/%3E%3Ctext x='90' y='108' font-family='Arial,Helvetica,sans-serif' font-size='42' font-weight='bold' fill='white' text-anchor='middle'%3ERTHK%3C/text%3E%3C/svg%3E",
                sizes: "180x180",
                type: "image/svg+xml",
                purpose: "any maskable"
            }]
        };
        const blob = new Blob([JSON.stringify(manifest)], { type: "application/json" });
        document.write('<link rel="manifest" href="' + URL.createObjectURL(blob) + '">');
    </script>

    <style>
        :root {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-main: #1a1a1a;
            --text-sub: #555555;
            --accent-red: #d32f2f;
            --accent-green: #2e7d32;
            --shadow: 0 6px 16px rgba(0,0,0,0.08);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        body {
            margin: 0;
            padding: calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 20px) 16px;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }
        header { text-align: center; margin-bottom: 20px; width: 100%; max-width: 500px; }
        h1 { font-size: 28px; font-weight: 800; margin: 0 0 6px 0; color: var(--accent-red); }
        .subtitle { font-size: 16px; color: var(--text-sub); font-weight: 600; }
        .status-card {
            background: var(--card-bg); width: 100%; max-width: 500px; padding: 16px 20px;
            border-radius: 20px; box-shadow: var(--shadow); margin-bottom: 20px;
            text-align: center; border: 3px solid transparent; transition: all 0.3s ease;
        }
        .status-card.playing { border-color: var(--accent-green); background: #f1f8e9; }
        .status-title { font-size: 22px; font-weight: bold; margin-bottom: 4px; }
        .status-state { font-size: 16px; font-weight: bold; color: var(--text-sub); }
        .status-card.playing .status-state { color: var(--accent-green); }
        .section-title {
            width: 100%; max-width: 500px; font-size: 15px; font-weight: 700;
            color: #888; margin: 8px 0 10px 4px; letter-spacing: 0.5px;
        }
        .grid-container { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 500px; margin-bottom: 16px; }
        .channel-btn {
            background: var(--card-bg); border: 3px solid #e0e0e0; border-radius: 20px;
            padding: 16px 20px; display: flex; align-items: center; justify-content: space-between;
            cursor: pointer; box-shadow: var(--shadow); width: 100%; text-align: left;
            transition: transform 0.1s, border-color 0.2s, background 0.2s;
        }
        .channel-btn:active { transform: scale(0.98); }
        .channel-btn.active { border-color: var(--accent-red); background: #fff8f8; }
        .channel-info { display: flex; flex-direction: column; }
        .channel-name { font-size: 22px; font-weight: 800; line-height: 1.2; }
        .channel-desc { font-size: 14px; color: var(--text-sub); margin-top: 3px; font-weight: 500; }
        .play-icon {
            width: 44px; height: 44px; border-radius: 50%; background: var(--accent-red);
            color: white; display: flex; align-items: center; justify-content: center;
            font-size: 20px; font-weight: bold; flex-shrink: 0; margin-left: 12px;
        }
        .channel-btn.active .play-icon { background: var(--accent-green); }
        .stop-btn {
            width: 100%; max-width: 500px; padding: 16px; font-size: 22px; font-weight: bold;
            color: white; background: #555; border: none; border-radius: 18px;
            box-shadow: var(--shadow); cursor: pointer; margin-bottom: 12px;
        }
        .stop-btn:active { opacity: 0.85; transform: scale(0.98); }
        .instructions {
            margin-top: auto; padding-top: 16px; text-align: center; font-size: 13px;
            color: #777; max-width: 500px; line-height: 1.5;
        }
        .note { font-size: 12px; color: #999; margin-top: 6px; }
    </style>
</head>
<body>

    <header>
        <h1>香港電台 + 商業電台</h1>
        <div class="subtitle">簡易播放器</div>
    </header>

    <div class="status-card" id="statusCard">
        <div class="status-title" id="currentChannel">請選擇電台</div>
        <div class="status-state" id="currentState">按下下方按鈕即可播放</div>
    </div>

    <div class="section-title">香港電台 RTHK</div>
    <div class="grid-container">
        <button class="channel-btn" onclick="playChannel(event, 1, '第一台', 'https://rthkradio1-live.akamaized.net/hls/live/2035313/radio1/master.m3u8')">
            <div class="channel-info">
                <span class="channel-name">第一台</span>
                <span class="channel-desc">FM 92.6–94.4　新聞與時事</span>
            </div>
            <div class="play-icon" id="icon-1">▶</div>
        </button>
        <button class="channel-btn" onclick="playChannel(event, 2, '第二台', 'https://rthkradio2-live.akamaized.net/hls/live/2040078/radio2/master.m3u8')">
            <div class="channel-info">
                <span class="channel-name">第二台</span>
                <span class="channel-desc">FM 94.8–96.9　流行音樂與家庭</span>
            </div>
            <div class="play-icon" id="icon-2">▶</div>
        </button>
        <button class="channel-btn" onclick="playChannel(event, 3, '第三台', 'https://rthkradio3-live.akamaized.net/hls/live/2040079/radio3/master.m3u8')">
            <div class="channel-info">
                <span class="channel-name">第三台</span>
                <span class="channel-desc">AM 567 / FM 106.8　英文台</span>
            </div>
            <div class="play-icon" id="icon-3">▶</div>
        </button>
        <button class="channel-btn" onclick="playChannel(event, 4, '第四台', 'https://rthkradio4-live.akamaized.net/hls/live/2040080/radio4/master.m3u8')">
            <div class="channel-info">
                <span class="channel-name">第四台</span>
                <span class="channel-desc">FM 97.6–98.9　古典音樂與藝術</span>
            </div>
            <div class="play-icon" id="icon-4">▶</div>
        </button>
        <button class="channel-btn" onclick="playChannel(event, 5, '第五台', 'https://rthkradio5-live.akamaized.net/hls/live/2040081/radio5/master.m3u8')">
            <div class="channel-info">
                <span class="channel-name">第五台</span>
                <span class="channel-desc">AM 783 / FM 106.9　長者與戲曲</span>
            </div>
            <div class="play-icon" id="icon-5">▶</div>
        </button>
    </div>

    <div class="section-title">商業電台 CRHK</div>
    <div class="grid-container">
        <button class="channel-btn" onclick="playChannel(event, 6, '雷霆881', 'https://d2agljdoug3z0j.cloudfront.net/radio-HTTP/cr1-hd.3gp/chunklist.m3u8')">
            <div class="channel-info">
                <span class="channel-name">雷霆881</span>
                <span class="channel-desc">FM 88.1–89.5　時事、清談、音樂</span>
            </div>
            <div class="play-icon" id="icon-6">▶</div>
        </button>
        <button class="channel-btn" onclick="playChannel(event, 7, '叱咤903', 'https://d2agljdoug3z0j.cloudfront.net/radio-HTTP/cr2-hd.3gp/chunklist.m3u8')">
            <div class="channel-info">
                <span class="channel-name">叱咤903</span>
                <span class="channel-desc">FM 90.3–92.1　流行音樂、娛樂</span>
            </div>
            <div class="play-icon" id="icon-7">▶</div>
        </button>
    </div>

    <button class="stop-btn" onclick="stopAudio()">⏹ 停止播放</button>

    <div class="instructions">
        <b>加入主畫面：</b><br>
        iPhone → Safari 分享 →「加入主畫面」<br>
        Android → Chrome 選單 →「加入主畫面」
        <div class="note">※ 商業電台串流有時會因網絡保護而無法播放，屬正常情況</div>
    </div>

    <audio id="audioPlayer" playsinline preload="none"></audio>

    <script>
        const audio = document.getElementById('audioPlayer');
        const statusCard = document.getElementById('statusCard');
        const currentChannelEl = document.getElementById('currentChannel');
        const currentStateEl = document.getElementById('currentState');
        let activeId = null;

        function playChannel(e, id, name, url) {
            document.querySelectorAll('.channel-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.play-icon').forEach(icon => icon.textContent = '▶');

            e.currentTarget.classList.add('active');
            document.getElementById(`icon-${id}`).textContent = '🔊';

            currentChannelEl.textContent = name;
            currentStateEl.textContent = "連線中，請稍候...";
            statusCard.classList.remove('playing');

            activeId = id;
            audio.src = url;

            const playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    currentStateEl.textContent = "正在播放中 🟢";
                    statusCard.classList.add('playing');
                }).catch(() => {
                    currentStateEl.textContent = "播放失敗，請再試或換其他台";
                    statusCard.classList.remove('playing');
                });
            }
        }

        function stopAudio() {
            audio.pause();
            audio.removeAttribute('src');
            audio.load();
            activeId = null;
            document.querySelectorAll('.channel-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.play-icon').forEach(icon => icon.textContent = '▶');
            currentChannelEl.textContent = "已停止播放";
            currentStateEl.textContent = "請選擇上方電台播放";
            statusCard.classList.remove('playing');
        }

        audio.addEventListener('pause', () => {
            if (activeId && !audio.ended) {
                currentStateEl.textContent = "已暫停";
                statusCard.classList.remove('playing');
            }
        });
        audio.addEventListener('playing', () => {
            currentStateEl.textContent = "正在播放中 🟢";
            statusCard.classList.add('playing');
        });
        audio.addEventListener('error', () => {
            currentStateEl.textContent = "連線失敗，請再試一次";
            statusCard.classList.remove('playing');
        });
    </script>
</body>
</html>
