<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="香港電台">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#f5c6d0" id="themeColorMeta">
    <meta name="application-name" content="香港電台">
    
    <title>香港電台</title>

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23d32f2f'/%3E%3Ctext x='90' y='108' font-family='Arial,Helvetica,sans-serif' font-size='42' font-weight='bold' fill='white' text-anchor='middle'%3ERTHK%3C/text%3E%3C/svg%3E">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23d32f2f'/%3E%3Ctext x='90' y='108' font-family='Arial,Helvetica,sans-serif' font-size='42' font-weight='bold' fill='white' text-anchor='middle'%3ERTHK%3C/text%3E%3C/svg%3E">

    <script>
        const manifest = {
            name: "香港電台",
            short_name: "RTHK",
            description: "",
            start_url: "./",
            display: "standalone",
            background_color: "#f5c6d0",
            theme_color: "#f5c6d0",
            icons: [{
                src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23d32f2f'/%3E%3Ctext x='90' y='108' font-family='Arial,Helvetica,sans-serif' font-size='42' font-weight='bold' fill='white' text-anchor='middle'%3ERTHK%3C/text%3E%3C/svg%3E",
                sizes: "180x180",
                type: "image/svg+xml",
                purpose: "any maskable"
            }]
        };
        const blob = new Blob([JSON.stringify(manifest)], { type: "application/json" });
        document.write('<link rel="manifest" href="' + URL.createObjectURL(blob) + '">');
    </script>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15"></script>

    <style>
        :root {
            --bg-color: #f5c6d0;
            --bg-radio: #e8a8b6;
            --card-bg: #ffffff;
            --text-main: #1a1a1a;
            --text-sub: #555555;
            --accent-red: #d32f2f;
            --accent-green: #2e7d32;
            --shadow: 0 3px 8px rgba(0,0,0,0.08);
        }
        body.theme-blue {
            --bg-color: #9fc8e8;
            --bg-radio: #7eb0d6;
        }
        body.theme-pink {
            --bg-color: #f5c6d0;
            --bg-radio: #e8a8b6;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

        body {
            margin: 0;
            padding: calc(env(safe-area-inset-top) + 10px) 10px calc(env(safe-area-inset-bottom) + 10px) 10px;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.25s ease;
            max-width: 100%;
            overflow-x: hidden;
        }

        .theme-bar {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 10px;
        }
        .theme-btn {
            border: 2px solid #ddd;
            background: #fff;
            border-radius: 18px;
            padding: 5px 12px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            color: #444;
        }
        .theme-btn.active-pink {
            border-color: #f48fb1;
            background: #fce4ec;
            color: #c2185b;
        }
        .theme-btn.active-blue {
            border-color: #64b5f6;
            background: #e3f2fd;
            color: #1565c0;
        }

        .video-container {
            width: 100%;
            max-width: 400px;
            display: none;
            margin-bottom: 10px;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            box-shadow: var(--shadow);
        }
        .video-container.show {
            display: block;
        }
        #mediaPlayer {
            width: 100%;
            height: auto;
            max-height: 225px;
            display: block;
            background: #000;
        }

        .status-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 400px;
            padding: 11px 14px;
            border-radius: 14px;
            box-shadow: var(--shadow);
            margin-bottom: 10px;
            text-align: center;
            border: 2.5px solid transparent;
            transition: all 0.3s ease;
        }
        .status-card.playing {
            border-color: var(--accent-green);
            background: #f1f8e9;
        }
        .status-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 1px;
        }
        .status-state {
            font-size: 13px;
            font-weight: bold;
            color: var(--text-sub);
        }
        .status-card.playing .status-state {
            color: var(--accent-green);
        }

        .stop-btn {
            width: 100%;
            max-width: 400px;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background: #555;
            border: none;
            border-radius: 12px;
            box-shadow: var(--shadow);
            cursor: pointer;
            margin-bottom: 12px;
        }
        .stop-btn:active {
            opacity: 0.85;
            transform: scale(0.98);
        }

        .radio-section {
            width: 100%;
            max-width: 400px;
            background: var(--bg-radio);
            border-radius: 16px;
            padding: 12px 10px 6px;
            margin-bottom: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
        }

        .section-title {
            width: 100%;
            max-width: 400px;
            font-size: 17px;
            font-weight: 800;
            color: #555;
            margin: 4px 0 8px 2px;
        }
        .radio-section .section-title {
            margin-top: 2px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 10px;
        }
        .radio-section .grid-container {
            margin-bottom: 6px;
        }

        .channel-btn {
            background: var(--card-bg);
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 10px 10px;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            box-shadow: var(--shadow);
            text-align: left;
            min-height: 62px;
            transition: transform 0.1s, border-color 0.2s, background 0.2s;
        }
        .channel-btn:active {
            transform: scale(0.97);
        }
        .channel-btn.active {
            border-color: var(--accent-red);
            background: #fff8f8;
        }
        .channel-btn.link-btn {
            border-style: dashed;
        }

        .channel-info {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 0;
            padding-right: 6px;
        }
        .channel-name {
            font-size: 16px;          /* 增大約 15% */
            font-weight: 800;
            line-height: 1.2;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .channel-name .icon {
            font-size: 15px;
            flex-shrink: 0;
            width: 18px;
            text-align: center;
        }
        .channel-desc {
            font-size: 10px;
            color: var(--text-sub);
            font-weight: 500;
            margin-top: 2px;
            line-height: 1.25;
            padding-left: 23px;
        }

        .play-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--accent-red);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: bold;
            flex-shrink: 0;
        }
        .channel-btn.active .play-icon {
            background: var(--accent-green);
        }
        .channel-btn.link-btn .play-icon {
            background: #666;
            font-size: 12px;
        }

        .instructions {
            margin-top: auto;
            padding-top: 12px;
            text-align: center;
            font-size: 11px;
            color: #777;
            max-width: 400px;
            line-height: 1.55;
        }
        .instructions .line {
            display: block;
        }
        .note {
            font-size: 10px;
            color: #999;
            margin-top: 2px;
        }

        @media screen and (max-width: 420px) {
            body {
                padding: calc(env(safe-area-inset-top) + 8px) 8px calc(env(safe-area-inset-bottom) + 8px) 8px;
            }
            .grid-container {
                gap: 7px;
            }
            .channel-btn {
                min-height: 58px;
                padding: 8px 9px;
            }
            .channel-name {
                font-size: 15.5px;    /* 增大約 15% */
            }
            .play-icon {
                width: 30px;
                height: 30px;
                font-size: 12px;
            }
            .section-title {
                font-size: 16px;
                margin: 3px 0 7px 1px;
            }
            .stop-btn {
                padding: 11px;
                font-size: 15px;
                margin-bottom: 10px;
            }
            #mediaPlayer {
                max-height: 200px;
            }
            .channel-desc {
                padding-left: 22px;
            }
        }
    </style>
</head>
<body class="theme-pink">

    <div class="theme-bar">
        <button class="theme-btn active-pink" id="btnPink" onclick="setTheme('pink')">🌸 粉紅</button>
        <button class="theme-btn" id="btnBlue" onclick="setTheme('blue')">💙 淺藍</button>
    </div>

    <div class="video-container" id="videoContainer">
        <video id="mediaPlayer" playsinline webkit-playsinline controls></video>
    </div>

    <div class="status-card" id="statusCard">
        <div class="status-title" id="currentChannel">請選擇電台</div>
        <div class="status-state" id="currentState">按下下方按鈕即可播放</div>
    </div>

    <button class="stop-btn" onclick="stopAudio()">⏹ 停止播放</button>

    <!-- 電台區域 -->
    <div class="radio-section">
        <div class="section-title">香港電台
