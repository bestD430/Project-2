<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="香港電台">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#d32f2f">
    <meta name="application-name" content="香港電台">
    
    <title>香港電台 + 新城電台</title>

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23d32f2f'/%3E%3Ctext x='90' y='108' font-family='Arial,Helvetica,sans-serif' font-size='42' font-weight='bold' fill='white' text-anchor='middle'%3ERTHK%3C/text%3E%3C/svg%3E">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23d32f2f'/%3E%3Ctext x='90' y='108' font-family='Arial,Helvetica,sans-serif' font-size='42' font-weight='bold' fill='white' text-anchor='middle'%3ERTHK%3C/text%3E%3C/svg%3E">

    <script>
        const manifest = {
            name: "香港電台",
            short_name: "RTHK",
            description: "香港電台 + 新城電台簡易播放器",
            start_url: "./",
            display: "standalone",
            background_color: "#fff0f5",
            theme_color: "#d32f2f",
            icons: [{
                src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23d32f2f'/%3E%3Ctext x='90' y='108' font-family='Arial,Helvetica,sans-serif' font-size='42' font-weight='bold' fill='white' text-anchor='middle'%3ERTHK%3C/text%3E%3C/svg%3E",
                sizes: "180x180",
                type: "image/svg+xml",
                purpose: "any maskable"
            }]
        };
        const blob = new Blob([JSON.stringify(manifest)], { type: "application/json" });
        document.write('<link rel="manifest" href="' + URL.createObjectURL(blob) + '">');
    </script>

    <style>
        :root {
            --bg-color: #fff0f5; /* 預設粉紅 */
            --card-bg: #ffffff;
            --text-main: #1a1a1a;
            --text-sub: #555555;
            --accent-red: #d32f2f;
            --accent-green: #2e7d32;
            --shadow: 0 4px 12px rgba(0,0,0,0.08);
        }
        body.theme-blue {
            --bg-color: #e8f4fc;
        }
        body.theme-pink {
            --bg-color: #fff0f5;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        body {
            margin: 0;
            padding: calc(env(safe-area-inset-top) + 16px) 12px calc(env(safe-area-inset-bottom) + 16px) 12px;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
            transition: background-color 0.25s ease;
        }
        header { text-align: center; margin-bottom: 12px; width: 100%; max-width: 520px; }
        h1 { font-size: 24px; font-weight: 800; margin: 0 0 4px 0; color: var(--accent-red); }
        .subtitle { font-size: 14px; color: var(--text-sub); font-weight: 600; }

        /* 底色切換 */
        .theme-switch {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 10px;
        }
        .theme-btn {
            border: 2px solid #ddd;
            background: #fff;
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            color: #444;
        }
        .theme-btn.active-pink {
            border-color: #f48fb1;
            background: #fce4ec;
            color: #c2185b;
        }
        .theme-btn.active-blue {
            border-color: #64b5f6;
            background: #e3f2fd;
            color: #1565c0;
        }

        .status-card {
            background: var(--card-bg); width: 100%; max-width: 520px; padding: 14px 16px;
            border-radius: 16px; box-shadow: var(--shadow); margin-bottom: 14px;
            text-align: center; border: 3px solid transparent; transition: all 0.3s ease;
        }
        .status-card.playing { border-color: var(--accent-green); background: #f1f8e9; }
        .status-title { font-size: 18px; font-weight: bold; margin-bottom: 2px; }
        .status-state { font-size: 14px; font-weight: bold; color: var(--text-sub); }
        .status-card.playing .status-state { color: var(--accent-green); }
        .section-title {
            width: 100%; max-width: 520px; font-size: 13px; font-weight: 700;
            color: #888; margin: 4px 0 8px 2px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
            max-width: 520px;
            margin-bottom: 12px;
        }
        .channel-btn {
            background: var(--card-bg);
            border: 2.5px solid #e0e0e0;
            border-radius: 14px;
            padding: 12px 12px;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            box-shadow: var(--shadow);
            text-align: left;
            min-height: 72px;
            transition: transform 0.1s, border-color 0.2s, background 0.2s;
        }
        .channel-btn:active { transform: scale(0.97); }
        .channel-btn.active { border-color: var(--accent-red); background: #fff8f8; }
        .channel-btn.link-btn { border-style: dashed; }
        .channel-info {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 0;
            padding-right: 8px;
        }
        .channel-name { font-size: 16px; font-weight: 800; line-height: 1.2; }
        .channel-desc { font-size: 11px; color: var(--text-sub); font-weight: 500; margin-top: 3px; line-height: 1.3; }
        .play-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--accent-red);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: bold;
            flex-shrink: 0;
        }
        .channel-btn.active .play-icon { background: var(--accent-green); }
        .channel-btn.link-btn .play-icon { background: #666; font-size: 14px; }
        .stop-btn {
            width: 100%; max-width: 520px; padding: 14px; font-size: 18px; font-weight: bold;
            color: white; background: #555; border: none; border-radius: 14px;
            box-shadow: var(--shadow); cursor: pointer; margin-bottom: 8px;
        }
        .stop-btn:active { opacity: 0.85; transform: scale(0.98); }
        .instructions {
            margin-top: auto; padding-top: 12px; text-align: center; font-size: 12px;
            color: #777; max-width: 520px; line-height: 1.5;
        }
        .note { font-size: 11px; color: #999; margin-top: 4px; }
    </style>
</head>
<body class="theme-pink">

    <header>
        <h1>香港電台 + 新城電台</h1>
        <div class="subtitle">簡易播放器</div>
        <div class="theme-switch">
            <button class="theme-btn active-pink" id="btnPink" onclick="setTheme('pink')">🌸 粉紅</button>
            <button class="theme-btn" id="btnBlue" onclick="setTheme('blue')">💙 淺藍</button>
        </div>
    </header>

    <div class="status-card" id="statusCard">
        <div class="status-title" id="currentChannel">請選擇電台</div>
        <div class="status-state" id="currentState">按下下方按鈕即可播放</div>
    </div>

    <div class="section-title">香港電台 RTHK</div>
    <div class="grid-container">
        <button class="channel-btn" onclick="playChannel(event, 1, '第一台', 'https://rthkradio1-live.akamaized.net/hls/live/2035313/radio1/master.m3u8')">
            <div class="channel-info">
                <span class="channel-name">第一台</span>
                <span class="channel-desc">新聞與時事</span>
            </div>
            <div class="play-icon" id="icon-1">▶</div>
        </button>
        <button class="channel-btn" onclick="playChannel(event, 2, '第二台', 'https://rthkradio2-live.akamaized.net/hls/live/2040078/radio2/master.m3u8')">
            <div class="channel-info">
                <span class="channel-name">第二台</span>
                <span class="channel-desc">流行音樂</span>
            </div>
            <div class="play-icon" id="icon-2">▶</div>
        </button>
        <button class="channel-btn" onclick="playChannel(event, 3, '第三台', 'https://rthkradio3-live.akamaized.net/hls/live/2040079/radio3/master.m3u8')">
            <div class="channel-info">
                <span class="channel-name">第三台</span>
                <span class="channel-desc">英文台</span>
            </div>
            <div class="play-icon" id="icon-3">▶</div>
        </button>
        <button class="channel-btn" onclick="playChannel(event, 4, '第四台', 'https://rthkradio4-live.akamaized.net/hls/live/2040080/radio4/master.m3u8')">
            <div class="channel-info">
                <span class="channel-name">第四台</span>
                <span class="channel-desc">古典音樂</span>
            </div>
            <div class="play-icon" id="icon-4">▶</div>
        </button>
        <button class="channel-btn" onclick="playChannel(event, 5, '第五台', 'https://rthkradio5-live.akamaized.net/hls/live/2040081/radio5/master.m3u8')">
            <div class="channel-info">
                <span class="channel-name">第五台</span>
                <span class="channel-desc">長者與戲曲</span>
            </div>
            <div class="play-icon" id="icon-5">▶</div>
        </button>
        <div></div>
    </div>

    <div class="section-title">新城電台 Metro</div>
    <div class="grid-container">
        <button class="channel-btn" onclick="playChannel(event, 6, '知訊台 997', 'https://1603884249.rsc.cdn77.org/1603884249/index.m3u8')">
            <div class="channel-info">
                <span class="channel-name">知訊台 997</span>
                <span class="channel-desc">資訊・音樂</span>
            </div>
            <div class="play-icon" id="icon-6">▶</div>
        </button>
        <button class="channel-btn" onclick="playChannel(event, 7, '財經台 104', 'https://1716664847.rsc.cdn77.org/1716664847/index.m3u8')">
            <div class="channel-info">
                <span class="channel-name">財經台 104</span>
                <span class="channel-desc">財經・股市</span>
            </div>
            <div class="play-icon" id="icon-7">▶</div>
        </button>
    </div>

    <div class="section-title">商業電台（開啟官方網頁）</div>
    <div class="grid-container">
        <button class="channel-btn link-btn" onclick="openOfficial('https://www.881903.com/live/881')">
            <div class="channel-info">
                <span class="channel-name">雷霆881</span>
                <span class="channel-desc">官方直播頁</span>
            </div>
            <div class="play-icon">↗</div>
        </button>
        <button class="channel-btn link-btn" onclick="openOfficial('https://www.881903.com/live/903')">
            <div class="channel-info">
                <span class="channel-name">叱咤903</span>
                <span class="channel-desc">官方直播頁</span>
            </div>
            <div class="play-icon">↗</div>
        </button>
    </div>

    <button class="stop-btn" onclick="stopAudio()">⏹ 停止播放</button>

    <div class="instructions">
        iPhone：Safari 分享 →「加入主畫面」　｜　Android：Chrome 選單 →「加入主畫面」
        <div class="note">點商台會先停止本頁播放，再開啟 881903.com</div>
    </div>

    <audio id="audioPlayer" playsinline preload="none"></audio>

    <script>
        const audio = document.getElementById('audioPlayer');
        const statusCard = document.getElementById('statusCard');
        const currentChannelEl = document.getElementById('currentChannel');
        const currentStateEl = document.getElementById('currentState');
        let activeId = null;

        // 底色切換（會記住選擇）
        function setTheme(theme) {
            document.body.classList.remove('theme-pink', 'theme-blue');
            document.body.classList.add(theme === 'blue' ? 'theme-blue' : 'theme-pink');
            document.getElementById('btnPink').classList.toggle('active-pink', theme === 'pink');
            document.getElementById('btnBlue').classList.toggle('active-blue', theme === 'blue');
            try { localStorage.setItem('radioTheme', theme); } catch (e) {}
        }

        // 載入時還原上次選擇
        (function () {
            let saved = 'pink';
            try { saved = localStorage.getItem('radioTheme') || 'pink'; } catch (e) {}
            setTheme(saved);
        })();

        function playChannel(e, id, name, url) {
            document.querySelectorAll('.channel-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.play-icon').forEach(icon => {
                if (icon.textContent !== '↗') icon.textContent = '▶';
            });

            e.currentTarget.classList.add('active');
            const icon = document.getElementById(`icon-${id}`);
            if (icon) icon.textContent = '🔊';

            currentChannelEl.textContent = name;
            currentStateEl.textContent = "連線中，請稍候...";
            statusCard.classList.remove('playing');

            activeId = id;
            audio.src = url;

            const playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    currentStateEl.textContent = "正在播放中 🟢";
                    statusCard.classList.add('playing');
                }).catch(() => {
                    currentStateEl.textContent = "播放失敗，請再試一次";
                    statusCard.classList.remove('playing');
                });
            }
        }

        function openOfficial(url) {
            stopAudio();
            currentChannelEl.textContent = "已開啟商台網頁";
            currentStateEl.textContent = "本頁播放已停止";
            window.open(url, '_blank');
        }

        function stopAudio() {
            audio.pause();
            audio.removeAttribute('src');
            audio.load();
            activeId = null;
            document.querySelectorAll('.channel-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.play-icon').forEach(icon => {
                if (icon.textContent !== '↗') icon.textContent = '▶';
            });
            currentChannelEl.textContent = "已停止播放";
            currentStateEl.textContent = "請選擇上方電台播放";
            statusCard.classList.remove('playing');
        }

        audio.addEventListener('pause', () => {
            if (activeId && !audio.ended) {
                currentStateEl.textContent = "已暫停";
                statusCard.classList.remove('playing');
            }
        });
        audio.addEventListener('playing', () => {
            currentStateEl.textContent = "正在播放中 🟢";
            statusCard.classList.add('playing');
        });
        audio.addEventListener('error', () => {
            currentStateEl.textContent = "連線失敗，請再試一次";
            statusCard.classList.remove('playing');
        });
    </script>
</body>
</html>
